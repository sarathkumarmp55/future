[project]
name = "future"
authors = [
    { name = "sarath", email = "sarath@gmail.com"}
]
description = "future"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# Frappe Cloud checks these before adding the app to a bench. The desk layout
# (Sidebar / Dock / Workspace rails) needs Frappe 16.50 or later.
[tool.bench.frappe-dependencies]
frappe = ">=16.50.0,<17.0.0"
erpnext = ">=16.50.0,<17.0.0"
education = ">=16.0.0,<17.0.0"
